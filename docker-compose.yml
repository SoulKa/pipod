# One service = the whole backend. SQLite lives on a named volume, so tournament
# data survives restarts. Boards run on the Pis and point at this host's LAN IP.
services:
  server:
    build: .
    # Both host ports reach the same server: 80 for bare-IP links, 3000 for boards (which
    # default to it). Docker binds 80 on the host, so the server needs no privileges.
    # udp/3000 is LAN discovery; broadcasts often don't reach a bridged container, so boards
    # may still need the IP typed in (`network_mode: host` fixes that on Linux).
    ports:
      - '80:3000'
      - '3000:3000'
      - '3000:3000/udp'
    environment:
      PORT: 3000
      # The container only sees its own internal address, so links and QR codes need the
      # host's LAN origin, e.g. `PUBLIC_URL=http://192.168.1.20 docker compose up`.
      PUBLIC_URL: ${PUBLIC_URL:-}
      HOST: 0.0.0.0
      DATA_DIR: /data
      CONSOLE_DIR: /app/standalone/console/dist
    volumes:
      - pipod-data:/data
    restart: unless-stopped

volumes:
  pipod-data:
