name: ci

# Quality gates for every PR and push to main: formatting, types, and the vitest suites across
# all workspaces. Mirrors the root scripts developers run locally.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest # quality gates are arch-independent
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Format check
        run: yarn format:check

      - name: Type check
        run: yarn type-check

      - name: Test
        run: yarn test

  # Playwright over the built stack: console + board in Chromium, and the Electron launcher.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: yarn workspace @pipod/e2e playwright install --with-deps chromium

      # `yarn e2e` builds the stack (and fetches the Electron binary) first. Electron needs a
      # display even though nobody watches.
      - name: E2E
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1280x24" yarn e2e

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
