approvedGitRepositories:
  - "https://github.com/electron/node-gyp.git"
  - "https://github.com/electron/node-gyp.git#*"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# Upstream peer-metadata gaps. Both are packaging bugs in the dependency, not
# something the workspaces can satisfy by declaring anything themselves.
packageExtensions:
  # @unocss/vite peers on vite, but the umbrella `unocss` package declares no
  # vite peer of its own, so it cannot forward the one apps/dashboard provides.
  "unocss@*":
    peerDependencies:
      vite: "^5.0.0-0 || ^6.0.0-0 || ^7.0.0-0 || ^8.0.0-0"
    peerDependenciesMeta:
      vite:
        optional: true
  # electron-builder-squirrel-windows is only pulled in for the Squirrel.Windows
  # target; the launcher builds NSIS/mac/linux, and upstream never marked it optional.
  "app-builder-lib@*":
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
